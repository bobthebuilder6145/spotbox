<title>SpotBox — Legal</title>
<style>
  :root { --ink:#1F1B16; --stone:#FDFBF6; --muted:#6B5F53; --bronze:#B68235; --rule:#E7DFD1; }
  html,body{margin:0;padding:0;background:var(--stone);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
  .wrap{max-width:600px;margin:0 auto;padding:80px 24px;}
  .eyebrow{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--bronze);font-weight:600;}
  h1{font-family:'Cormorant Garamond','Times New Roman',serif;font-weight:500;font-size:44px;line-height:1.1;margin:12px 0 24px;}
  a{display:block;padding:16px 20px;margin-bottom:12px;background:#fff;border:1px solid var(--rule);border-radius:14px;color:var(--ink);text-decoration:none;}
  a:hover{border-color:var(--bronze);}
  .arrow{float:right;color:var(--bronze);}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">SpotBox</div>
  <h1>Legal</h1>

  <a href="terms.html">Terms of Use <span class="arrow">&rarr;</span></a>
